<!DOCTYPE html>
<html> 
    <head>
        <title>Eating at home</title>
    </head>
    <body
        style="background-color: rgb(216, 228, 227);">
        <h1 style="text-align: center; font-family: Georgia;">Eating at home</h1>
        
        <h4 style="text-align: center; margin-bottom: 10px; font-family: Georgia;">Who are you?</h4>
        <div
            style="display: flex; 
            justify-content: center;
            font-family: Georgia;
            flex-direction: column;
            text-align: center;">
                <label>
                    <input 
                        type="radio" 
                        name="miembro" 
                        value="Mamá" 
                    > Mama
                </label><br>
                <label>
                    <input 
                        type="radio" 
                        name="miembro" 
                        value="Papá" 
                    > Papa
                </label><br>
                <label>
                    <input 
                        type="radio" 
                        name="miembro" 
                        value="Julia" 
                    > Julia
                </label><br>
                <label>
                    <input 
                        type="radio" 
                        name="miembro" 
                        value="Marcos" 
                    > Marcos
                </label><br>
                <label>
                    <input 
                        type="radio" 
                        name="miembro" 
                        value="Claudia" 
                    > Claudia
                </label><br>
        </div>

        <h4 style="text-align: center; font-family: Georgia;">Are you eating at home today?</h4>
        <div
            style="display: flex; 
            justify-content: center; 
            gap: 10px;
            font-family: Georgia;">
                <button 
                    style="text-align: center; 
                    width: 175px; 
                    background-color: rgb(123, 173, 125); 
                    color: rgb(8, 49, 7); 
                    border-radius: 8px;
                    font-size: larger;
                    font-family: Georgia;"
                >Yes</button>
                <button 
                    style="width: 175px; 
                    height: 75px;
                    background-color: rgb(155, 101, 101); 
                    color: rgb(72, 26, 15); 
                    border-radius: 8px;
                    font-size: larger;
                    font-family: Georgia;"
                >No</button>
        </div>
        
        <div
            style="display: flex; 
            justify-content: center;
            font-family: Georgia;">
            <button
                style="margin-top: 30px; 
                width: 120px; 
                height: 40px; 
                background-color: rgb(103, 103, 103); 
                color: azure; 
                border-radius: 8px;
                font-family: Georgia;"
            >Confirm!</button>
        </div>
        

        <script type="text/javascript"></script>
    </body>
</html>
